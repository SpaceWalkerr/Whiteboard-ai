# Render Blueprint — STUB. Describes the production shape; actual deployment (staging and
# production services, secrets, domains) happens in Phase 13. Keep in sync with CLAUDE.md.
services:
  - type: web
    name: whiteboard-server
    runtime: node
    region: singapore # co-located with Supabase ap-southeast-1
    plan: starter # paid: the free tier sleeps and drops WebSockets
    numInstances: 2 # must work as 2+ instances (shared state via Redis)
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm turbo run build --filter=@whiteboard/server
    startCommand: node --enable-source-maps apps/server/dist/index.js
    healthCheckPath: /readyz
    # Our in-app shutdown deadline (SHUTDOWN_TIMEOUT_MS=25000) must stay below this.
    maxShutdownDelaySeconds: 30
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HUSKY
        value: "0" # skip git hook install during the build
      - key: LOG_LEVEL
        value: info
      - key: SHUTDOWN_TIMEOUT_MS
        value: "25000"
      - key: METRICS_TOKEN # bearer token for GET /metrics
        generateValue: true
      - key: DATABASE_URL # Supabase pooler, SESSION mode (port 5432)
        sync: false
      # Connections per instance. The session pooler allows ~15 per project on small computes:
      # 2 instances × 6 leaves room for migrations and cron. Raise with the Supabase compute.
      - key: DATABASE_POOL_MAX
        value: "6"
      # Persistence lease TTL: a dead instance's rooms are taken over within this time.
      - key: SYNC_LEASE_TTL_MS
        value: "15000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERN
        sync: false
      - key: TRUST_PROXY # Render's load balancer is one hop; rate limits need the client IP
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # Storage (thumbnails) only; never sent to the browser
        sync: false
      - key: ROOM_TICKET_SECRET # signs 5-minute sync tickets; shared by all instances
        generateValue: true
      - key: CRON_SECRET # bearer for /internal/* (trash purge cron, Phase 13)
        generateValue: true
      - key: ANTHROPIC_API_KEY # AI reviews/hints; server-only, never sent to the browser
        sync: false
      - key: AI_DAILY_SPEND_LIMIT_USD # kill-switch: AI calls stop for the day at this spend
        value: "20"
      - key: AI_ENABLED # set to "false" to stop every Claude call immediately
        value: "true"
      - key: APP_URL # web origin used in invite links
        sync: false
      - key: EMAIL_TRANSPORT
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: whiteboard-redis
          property: connectionString

  - type: keyvalue
    name: whiteboard-redis
    region: singapore # SAME region as the web service
    plan: starter
    maxmemoryPolicy: noeviction # leases and rate-limit counters must never be silently evicted
    ipAllowList: [] # private network only
