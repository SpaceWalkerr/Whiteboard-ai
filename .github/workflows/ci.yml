name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"
  # Public build-time value for the web app; points at the local server used by the e2e job.
  VITE_API_URL: http://localhost:4000
  VITE_WS_URL: ws://localhost:4000
  # Public build-time placeholders for the checks job; the e2e job overrides them with the
  # CI Supabase project's real (public) values.
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_0000

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Supabase's own Postgres image: same extensions, roles (anon, authenticated) and `auth`
      # schema as a hosted project, so migrations and the RLS test behave as in production.
      postgres:
        image: supabase/postgres:17.6.1.175
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # E2E signs real users in, so it runs against a dedicated CI Supabase project (never
    # production data): its database, Auth and keys come from repository secrets.
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CI_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      # Until the CI Supabase project's secrets are set (and on pull requests from forks, which
      # never receive secrets) there is nothing to run against: skip with a visible warning
      # instead of failing every push.
      - name: Check the CI Supabase project is configured
        id: config
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=E2E skipped::Set the CI_DATABASE_URL, CI_SUPABASE_URL, CI_SUPABASE_SERVICE_ROLE_KEY and CI_SUPABASE_PUBLISHABLE_KEY repository secrets (a dedicated CI Supabase project) to run the Playwright tests."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.config.outputs.ready == 'true'
        run: pnpm db:migrate
      - name: Generate a per-run room ticket secret
        if: steps.config.outputs.ready == 'true'
        run: echo "ROOM_TICKET_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Resolve Playwright version
        if: steps.config.outputs.ready == 'true'
        id: pw
        run: echo "version=$(pnpm --filter @whiteboard/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - if: steps.config.outputs.ready == 'true'
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.config.outputs.ready == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @whiteboard/web exec playwright install --with-deps chromium
      - if: steps.config.outputs.ready == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @whiteboard/web exec playwright install-deps chromium
      - if: steps.config.outputs.ready == 'true'
        run: pnpm test:e2e
      - if: failure() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
